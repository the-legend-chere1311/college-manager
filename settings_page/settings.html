<!DOCTYPE html>
<html lang="en">
<head>
    <link href="settings.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Josefin+Sans">
    <title>Settings | Task Manager</title>
</head>
<body>
    <div class="sidebar">
        <a href="../index.html"><img src="../icons/home.png"></a>
        <a href="../task_page/task.html"><img src="../icons/tasks.png"></a>
        <a href="../schedule_page/schedule.html"><img src="../icons/schedule.png"></a>
        <a href="../exams_page/exams.html"><img src="../icons/exams.png"></a>
        <a href="../analytics_page/analytics.html"><img src="../icons/analytics.png"></a>
        <a class="active" href="../settings_page/settings.html"><img src="../icons/settings.png"></a>
    </div>
    <div class="content">
        <h1>Settings</h1>
        
        <div class="settings-container">
            <!-- Account Settings Section -->
            <div class="settings-section">
                <h2>Account Settings</h2>
                
                <div class="setting-item">
                    <label for="username">Username</label>
                    <div class="input-group">
                        <input type="text" id="username" placeholder="Enter your username" value="User">
                        <button class="save-btn" onclick="saveUsername()">Save</button>
                    </div>
                </div>
                
                <div class="setting-item">
                    <label for="email">Email Address</label>
                    <div class="input-group">
                        <input type="email" id="email" placeholder="Enter your email" value="user@example.com">
                        <button class="save-btn" onclick="saveEmail()">Save</button>
                    </div>
                </div>
                
                <div class="setting-item">
                    <label for="current-password">Change Password</label>
                    <div class="password-group">
                        <input type="password" id="current-password" placeholder="Current password">
                        <input type="password" id="new-password" placeholder="New password">
                        <input type="password" id="confirm-password" placeholder="Confirm new password">
                        <button class="save-btn" onclick="changePassword()">Update Password</button>
                    </div>
                </div>
            </div>
            
            <!-- Appearance Settings Section -->
            <div class="settings-section">
                <h2>Appearance</h2>
                
                <div class="setting-item">
                    <label>Theme</label>
                    <div class="theme-toggle">
                        <input type="radio" id="dark-mode" name="theme" value="dark" checked>
                        <label for="dark-mode" class="theme-option">
                            <span class="theme-icon">🌙</span>
                            <span>Dark Mode</span>
                        </label>
                        
                        <input type="radio" id="light-mode" name="theme" value="light">
                        <label for="light-mode" class="theme-option">
                            <span class="theme-icon">☀️</span>
                            <span>Light Mode</span>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Notification Settings Section -->
            <div class="settings-section">
                <h2>Notifications</h2>
                
                <div class="setting-item">
                    <label class="switch-label">
                        <span>Task Reminders</span>
                        <label class="switch">
                            <input type="checkbox" id="task-notifications" checked>
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="switch-label">
                        <span>Exam Notifications</span>
                        <label class="switch">
                            <input type="checkbox" id="exam-notifications" checked>
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>
                
                <div class="setting-item">
                    <label class="switch-label">
                        <span>Spotify Integration</span>
                        <label class="switch">
                            <input type="checkbox" id="spotify-notifications" checked>
                            <span class="slider"></span>
                        </label>
                    </label>
                </div>
            </div>
            
            <!-- Data Management Section -->
            <div class="settings-section">
                <h2>Data Management</h2>
                
                <div class="setting-item">
                    <label>Export Data</label>
                    <div class="data-buttons">
                        <button class="action-btn export-btn" onclick="exportData()">
                            📊 Export All Data
                        </button>
                        <button class="action-btn backup-btn" onclick="backupData()">
                            💾 Create Backup
                        </button>
                    </div>
                </div>
                
                <div class="setting-item">
                    <label>Reset Data</label>
                    <div class="data-buttons">
                        <button class="action-btn danger-btn" onclick="clearAllData()">
                            🗑️ Clear All Data
                        </button>
                    </div>
                    <small class="warning-text">⚠️ This action cannot be undone</small>
                </div>
            </div>
        </div>
        
        <!-- Success/Error Messages -->
        <div id="message-container" class="message-container"></div>
    </div>
    
    <script src="settings.js"></script>
</body>
</html>
